services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    init: true
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${DB_NAME:-gymtec_erp}
      MYSQL_USER: ${DB_USER:-gymtec_user}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD_HASH_FILE: /run/secrets/app_admin_password_hash
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_ROLE: ${APP_ADMIN_ROLE:-Admin}
    secrets:
      - mysql_root_password
      - db_password
      - app_admin_password_hash
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/mysql-schema.sql:/docker-entrypoint-initdb.d/01-mysql-schema.sql:ro
      - ./backend/database/docker-bootstrap-compat.sql:/docker-entrypoint-initdb.d/02-docker-bootstrap-compat.sql:ro
      - ./backend/database/docker-patches.sql:/docker-entrypoint-initdb.d/03-docker-patches.sql:ro
      - ./backend/database/docker-seed-admin.sh:/docker-entrypoint-initdb.d/04-docker-seed-admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$(cat /run/secrets/mysql_root_password) --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-gymtec_user}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-gymtec_erp}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN en .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    secrets:
      - db_password
      - jwt_secret
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    networks:
      - app_net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8082}:80"
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_net

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  app_admin_password_hash:
    file: ./secrets/app_admin_password_hash.txt

volumes:
  mysql_data:
  uploads_data:

networks:
  app_net:
